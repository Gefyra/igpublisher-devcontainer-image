name: Build Devcontainer Image

on:
  repository_dispatch:
    types:
      - ig-publisher-image-updated
  push:
    branches:
      - main
      # Builds :test on top of ig-publisher-with-snapshot-support:test instead
      # of :latest, so a change can be tried in a test repository first.
      - 'test/**'
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-image.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Compute image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$owner/$repo" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/heads/test/* ]]; then
            echo "tag=test" >> "$GITHUB_OUTPUT"
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "test=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/gefyra/ig-publisher-with-snapshot-support:${{ steps.image.outputs.tag }}
          tags: ${{ steps.image.outputs.registry }}:${{ steps.image.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.image.outputs.registry }}:buildcache
          # A test build must not overwrite the cache the :latest builds use.
          cache-to: ${{ steps.image.outputs.test != 'true' && format('type=registry,ref={0}:buildcache,mode=max', steps.image.outputs.registry) || '' }}

      - name: Determine SUSHI version
        id: sushi
        if: steps.image.outputs.test != 'true'
        run: |
          version=$(docker run --rm --platform linux/amd64 --entrypoint sushi ${{ steps.image.outputs.registry }}:latest --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$version" ]; then
            echo "Unable to detect SUSHI version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag and push version-specific image
        if: steps.image.outputs.test != 'true'
        env:
          VERSION: ${{ steps.sushi.outputs.version }}
        run: |
          IMAGE=${{ steps.image.outputs.registry }}
          docker buildx imagetools create \
            --tag $IMAGE:sushi-$VERSION \
            $IMAGE:latest
